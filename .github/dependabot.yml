    directory: "modules/atc-security"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: "modules/atc-shivacore/boot"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: "modules/atc-shivacore/kernel"
